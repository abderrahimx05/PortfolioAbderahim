name: CI/CD — vérification et déploiement GitHub Pages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Vérifier le site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Valider le HTML
        run: npx --yes htmlhint@1 "*.html"

      - name: Vérifier les fichiers référencés
        run: ./scripts/check-links.sh

      - name: Préparer le site à publier
        run: |
          mkdir _site
          cp index.html portfolioHome.html CV_Abderahim_FullStack_DevOps.pdf _site/

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Déployer sur GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
